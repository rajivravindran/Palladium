[project]
name = "river3-api"
version = "0.2.0"
description = "River3 API: hub between the runtime layers and the operator console"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["river3_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
