name: river3-notes-lab
services:
  api:
    build: ./integration
    image: river3-notes-control:local
    container_name: river3-notes-api
    environment:
      RIVER3_ENV: development
      RIVER3_DATABASE_URL: sqlite:////state/river3.db
      RIVER3_DRIFT_MODEL: "off"
    volumes:
      - ./integration/state:/state
    command: ["sh", "-c", "python -m alembic upgrade head && exec python -m uvicorn river3_api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:8788:8787"
    networks: [control, downloads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  controller:
    image: river3-notes-control:local
    container_name: river3-notes-controller
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    environment:
      RIVER3_CONTAINMENT_TOKEN: dev-containment-token
      RIVER3_POLICY_TOKEN: dev-policy-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./integration/registry.json:/config/registry.json:ro
      - ./integration/profiles:/config/profiles:ro
      - ./integration/state:/state
    command: ["river3-containd", "-adapter", "docker", "-registry-from-runtime", "-runtime", "docker", "-registry", "/config/registry.json", "-profiles", "/config/profiles", "-profiles-from-api", "-api", "http://127.0.0.1:8000", "-journal", "/state/controller.journal", "-listen", "0.0.0.0:8787", "-registry-refresh", "2s", "-profile-sync", "2s", "-poll", "2s"]
  sensor:
    image: river3-notes-control:local
    container_name: river3-notes-sensor
    network_mode: service:api
    pid: host
    cgroup: host
    privileged: true
    depends_on:
      api:
        condition: service_healthy
      controller:
        condition: service_started
    environment:
      RIVER3_SENSOR_TOKEN: dev-sensor-token
      RIVER3_INGEST_TOKEN: dev-sensor-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
    command: ["sh", "-c", "mount -t tracefs tracefs /sys/kernel/tracing && exec river3d -source ebpf -discover docker -runtime docker -enroll '' -refresh 2s -controller http://127.0.0.1:8787 -api http://127.0.0.1:8000 -stdout"]
  model:
    image: ollama/ollama:latest
    container_name: river3-notes-model
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - models:/root/.ollama
    networks: [inference, downloads]
    mem_limit: 4g
    cpus: 4
  agent:
    build: .
    image: river3-notes-agent:local
    container_name: river3-notes-agent
    environment:
      OLLAMA_URL: http://model:11434
      MODEL: ${MODEL:-qwen2.5-coder:1.5b}
      MAX_STEPS: "18"
    volumes:
      - ./workspace:/workspace
      - ./evidence:/evidence
    networks: [inference, downloads]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    labels:
      river3.enroll: "true"
      river3.asset_id: coding-notes-agent-01
      river3.workload: coding-notes-agent-01
      river3.profile: coding-notes-agent
      river3.kind: ai_worker
      river3.team: platform
      river3.name: coding-notes-agent-01
volumes:
  models:
networks:
  control:
    internal: true
  inference:
    internal: true
  downloads:
